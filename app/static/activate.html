<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>司機裝置啟用</title><link rel="stylesheet" href="/static/style.css"></head><body><main class="mobile"><div class="card"><h1>司機裝置啟用</h1><div id="info">檢查中…</div><div id="form" class="hidden"><p>請設定 4 位 PIN</p><input id="pin" maxlength="4" inputmode="numeric" style="width:100%;font-size:28px;text-align:center"><button class="btn big" style="margin-top:12px" onclick="go()">啟用此手機</button></div><div id="msg"></div></div></main><script src="/static/common.js"></script><script>const token='__ACTIVATION_TOKEN__';async function init(){try{let x=await api('/api/driver-activation/'+token);info.innerHTML='<h2>'+x.driver+'</h2><p>此 QR 最長 10 分鐘有效，使用一次即失效。</p>';form.classList.remove('hidden')}catch(e){info.innerHTML='<div class="error">'+e.message+'</div>'}}init();async function go(){try{let x=await api('/api/driver-activation/'+token,{method:'POST',body:JSON.stringify({pin:pin.value})});localStorage.setItem('driver_device_key',x.device_key);msg.innerHTML='<div class="ok">裝置啟用完成。<br><a href="/driver">前往司機工作頁</a></div>';form.classList.add('hidden')}catch(e){msg.innerHTML='<div class="error">'+e.message+'</div>'}}</script></body></html>
