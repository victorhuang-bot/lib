<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" type="image/png" href="/static/moving-match-favicon.png"><title>司機登入</title><link rel="stylesheet" href="/static/style.css"></head><body><main class="mobile"><div class="card"><h1>司機登入</h1><div id="info">正在驗證司機網址…</div><div id="msg"></div></div></main><script src="/static/common.js"></script><script>
const activationToken='__ACTIVATION_TOKEN__';
async function init(){
 try{
  const x=await api('/api/driver-activation/'+encodeURIComponent(activationToken));
  document.getElementById('info').textContent=x.driver+'｜正在登入…';
  const login=await api('/api/driver-activation/'+encodeURIComponent(activationToken),{method:'POST',body:'{}'});
  sessionStorage.setItem('driver_session_token',login.token);
  location.replace('/driver');
 }catch(e){
  document.getElementById('info').textContent='無法登入';
  document.getElementById('msg').textContent=e.message||'請聯絡管理員重新產生司機網址';
 }
}
init();
</script></body></html>
