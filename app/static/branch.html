<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>分館簽收</title><link rel="stylesheet" href="/static/style.css"></head><body>
<div id="desktopLogin" class="desktop-login-card">
  <h2>分館桌機登入</h2>
  <p class="muted">手機可繼續掃固定 QR；桌機可輸入分館代碼與 4 位 PIN，登入後進入同一套簽收流程。</p>
  <div class="desktop-login-grid">
    <label>分館代碼<input id="desktopBranchCode" placeholder="例如 A13"></label>
    <label>4 位 PIN<input id="desktopBranchPin" type="password" inputmode="numeric" maxlength="4"></label>
    <button class="btn" onclick="desktopLogin()">登入</button>
  </div>
</div><main class="mobile"><div class="card"><h1>分館簽收驗證</h1><div id="verify"><p class="muted">請輸入 4 位分館驗證碼</p><input id="pin" inputmode="numeric" maxlength="4" placeholder="○ ○ ○ ○" style="width:100%;font-size:26px;text-align:center"><button class="btn big" style="margin-top:10px" onclick="verifyBranch()">確認</button></div><div id="work" class="hidden"></div><div id="msg"></div></div></main><script src="/static/common.js"></script><script>
const branchToken='__BRANCH_TOKEN__';let session=null,data=null,getSig=null;
async function bapi(url,opt={}){opt.headers={...(opt.headers||{}),'Authorization':'Bearer '+session,'Content-Type':'application/json'};let r=await fetch(url,opt);let text=await r.text(),j=null;try{j=text?JSON.parse(text):{}}catch(_){j={detail:text||('HTTP '+r.status)}}if(!r.ok)throw new Error(j.detail||('HTTP '+r.status));return j}

async function desktopLogin(){
  try{
    const branch_code=(document.querySelector('#desktopBranchCode').value||'').trim();
    const pin=(document.querySelector('#desktopBranchPin').value||'').trim();
    if(!branch_code||!pin)throw new Error('請輸入分館代碼與 PIN');
    const x=await fetch('/api/branch-session/desktop-login',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({branch_code,pin})
    }).then(async r=>{const t=await r.text();let j;try{j=t?JSON.parse(t):{}}catch(_){j={detail:t||('HTTP '+r.status)}}if(!r.ok)throw new Error(j.detail||'登入失敗');return j});
    session=x.session;
    sessionStorage.setItem('branch_session',session);
    document.querySelector('#desktopLogin').classList.add('hidden');
    await load();
  }catch(e){alert(e.message)}
}
async function verifyBranch(){try{let x=await api('/api/branch-session/verify',{method:'POST',body:JSON.stringify({token:branchToken,pin:document.querySelector('#pin').value})});session=x.session;document.querySelector('#verify').classList.add('hidden');work.classList.remove('hidden');await load()}catch(e){msg.innerHTML='<div class="error">'+e.message+'</div>'}}
async function load(){data=await bapi('/api/branch-session/today');if(data.status==='WAITING_BRANCH'||data.status==='LATE_BRANCH_PENDING')renderSign();else if(data.status==='WAITING_BRANCH_CORRECTION')renderCorrection();else work.innerHTML=`<h2>${data.branch_name}</h2><div class="ok">今日狀態：${statusText(data.status)}</div><p>簽收人：${data.correction_signer_name||data.signer_name||'—'}</p><p>簽收時間：${data.receipt_at||data.corrected_at||data.branch_signed_at||'—'}</p>`}
function canvasBlock(){return `<canvas id="sig" class="sig" width="600" height="220"></canvas><button class="btn alt" onclick="clearSig()">清除簽名</button>`}
function carriedItemsText(){const names={POSTER:'海報',PROMOTION:'文宣',STATIONERY:'文具'};const a=data.items||[];return a.length?a.map(x=>`${x.item_type==='OTHER'?(x.item_name||'其他'):(names[x.item_type]||x.item_type)} ${x.quantity}`).join('、'):'無'}
function receiptInputValue(v){if(v){return String(v).replace(' ','T').slice(0,16)}const d=new Date(),p=n=>String(n).padStart(2,'0');return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}T${p(d.getHours())}:${p(d.getMinutes())}`}
function renderSign(){const late=data.status==='LATE_BRANCH_PENDING';work.innerHTML=`<h2>${data.branch_name}</h2><div class="${late?'notice':'muted'}">配送日期：<b>${data.service_date}</b>${late?'<br>此筆為未完成簽名的補填資料。可補填/修正數量並完成第一次簽名；送出後即鎖定，司機不需再次確認。':''}</div><div class="ok"><b>總館公文送出：</b>${data.document_final??'尚未填寫'}<br><b>司機圖書送出：</b>${data.outbound_final??0}<br><b>總館其他隨車物品：</b>${carriedItemsText()}</div><div class="qty-grid">
        <label>公文送出<input id="doc" type="number" min="0" value="${data.document_final??0}"></label>
        <label>公文收回<input id="docReturn" type="number" min="0" value="${data.document_return_final??0}"></label>
        <label>圖書送出<input id="out" type="number" min="0" value="${data.outbound_final??0}"></label>
        <label>圖書收回<input id="inn" type="number" min="0" value="${data.inbound_final??0}"></label>
        </div><p>備註</p><textarea id="note" style="width:100%">${data.note_final||''}</textarea><p>實際簽收時間</p><input id="receiptAt" type="datetime-local" value="${receiptInputValue(data.receipt_at)}" style="width:100%"><div class="muted">預設目前時間，可依實際簽收時間修改；系統真正送出簽名時間會另外保留。</div><p>簽收人姓名</p><input id="signer" style="width:100%"> <p>請簽名</p>${canvasBlock()}<button class="btn big" style="margin-top:12px" onclick="sign()">${late?'確認補填並完成簽名':'確認簽收'}</button>`;getSig=sigPad(document.querySelector('#sig'))}
function renderCorrection(){let c=data.correction;work.innerHTML=`<h2>${data.branch_name}</h2><div class="notice"><b>司機要求更正</b><br>${c?.driver_note||'請重新確認數量；只需填寫需要修改的欄位'}</div><div class="ok" style="margin-top:10px">數量欄位為選填。留白代表沿用目前數量，不會被改成 0。</div><div class="ok"><b>總館公文送出：</b>${data.document_final??'尚未填寫'}<br><b>司機圖書送出：</b>${data.outbound_final??0}<br><b>總館其他隨車物品：</b>${carriedItemsText()}</div><p>公文收回（目前：${data.document_return_final??0}）</p><input id="document_return" type="number" min="0" placeholder="若不修改請留白" style="width:100%"><p>圖書收回（目前：${data.inbound_final??0}）</p><input id="inbound" type="number" min="0" placeholder="若不修改請留白" style="width:100%"><p>更正原因＊</p><textarea id="reason" style="width:100%"></textarea><p>更正人姓名＊</p><input id="signer" style="width:100%"><p>請重新簽名</p>${canvasBlock()}<button class="btn big" style="margin-top:12px" onclick="correct()">送出更正並重新簽名</button>`;getSig=sigPad(document.querySelector('#sig'))}
function clearSig(){let c=document.querySelector('#sig');c.getContext('2d').clearRect(0,0,c.width,c.height)}
async function sign(){if(!confirm(data.status==='LATE_BRANCH_PENDING'?'確認補填數量並完成簽名？送出後即不可再修改。':'確認完成本次簽收？'))return;try{await bapi('/api/branch-session/sign',{method:'POST',body:JSON.stringify({document:+doc.value,document_return:+docReturn.value,outbound:+out.value,inbound:+inn.value,note:note.value,signer:signer.value,signature:getSig(),receipt_at:receiptAt.value})});await load()}catch(e){alert(e.message)}}
async function correct(){try{const val=id=>{const v=document.getElementById(id).value.trim();return v===''?null:Number(v)};await bapi('/api/branch-session/correct',{method:'POST',body:JSON.stringify({document_return:val('document_return'),inbound:val('inbound'),reason:reason.value,signer:signer.value,signature:getSig()})});await load()}catch(e){alert(e.message)}}
</script></body></html>
