<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>分館簽收</title><link rel="stylesheet" href="/static/style.css"></head><body><main class="mobile"><div class="card"><h1>分館簽收驗證</h1><div id="verify"><p class="muted">請輸入 4 位分館驗證碼</p><input id="pin" inputmode="numeric" maxlength="4" placeholder="○ ○ ○ ○" style="width:100%;font-size:26px;text-align:center"><button class="btn big" style="margin-top:10px" onclick="verify()">確認</button></div><div id="work" class="hidden"></div><div id="msg"></div></div></main><script src="/static/common.js"></script><script>
const branchToken='__BRANCH_TOKEN__';let session=null,data=null,getSig=null;async function bapi(url,opt={}){opt.headers={...(opt.headers||{}),'Authorization':'Bearer '+session,'Content-Type':'application/json'};let r=await fetch(url,opt);let j=await r.json();if(!r.ok)throw new Error(j.detail||'錯誤');return j}
async function verify(){try{let x=await api('/api/branch-session/verify',{method:'POST',body:JSON.stringify({token:branchToken,pin:pin.value})});session=x.session;verify.classList?.add('hidden');document.querySelector('#verify').classList.add('hidden');work.classList.remove('hidden');await load()}catch(e){msg.innerHTML='<div class="error">'+e.message+'</div>'}}
async function load(){data=await bapi('/api/branch-session/today');if(data.status==='WAITING_BRANCH')renderSign();else if(data.status==='WAITING_BRANCH_CORRECTION')renderCorrection();else work.innerHTML=`<h2>${data.branch_name}</h2><div class="ok">今日狀態：${statusText(data.status)}</div><p>簽收人：${data.signer_name||'—'}</p><p>簽收時間：${data.branch_signed_at||'—'}</p>`}
function canvasBlock(){return `<canvas id="sig" class="sig" width="600" height="220"></canvas><button class="btn alt" onclick="clearSig()">清除簽名</button>`}
function renderSign(){work.innerHTML=`<h2>${data.branch_name}</h2><p>公文數量</p><input id="doc" type="number" min="0" value="${data.document_final??0}" style="width:100%"><p>圖書送出</p><input id="out" type="number" min="0" value="${data.outbound_final??0}" style="width:100%"><p>圖書收回</p><input id="inn" type="number" min="0" value="0" style="width:100%"><p>備註</p><textarea id="note" style="width:100%"></textarea><p>簽收人姓名</p><input id="signer" style="width:100%"> <p>請簽名</p>${canvasBlock()}<button class="btn big" style="margin-top:12px" onclick="sign()">確認簽收</button>`;getSig=sigPad(document.querySelector('#sig'))}
function renderCorrection(){let c=data.correction,fields=JSON.parse(c.fields_json);let rows='';let map={document:['公文數量','document_final'],outbound:['圖書送出','outbound_final'],inbound:['圖書收回','inbound_final'],note:['備註','note_final']};for(let f of fields){let [label,key]=map[f];rows+=`<p>${label}（原值：${data[key]??''}）</p>${f==='note'?`<textarea id="${f}" style="width:100%">${data[key]??''}</textarea>`:`<input id="${f}" type="number" value="${data[key]??0}" style="width:100%">`}`}work.innerHTML=`<h2>${data.branch_name}</h2><div class="notice"><b>司機要求更正</b><br>${c.driver_note||''}</div>${rows}<p>更正原因＊</p><textarea id="reason" style="width:100%"></textarea><p>更正人姓名＊</p><input id="signer" style="width:100%"><p>請重新簽名</p>${canvasBlock()}<button class="btn big" style="margin-top:12px" onclick="correct()">送出唯一一次更正</button>`;getSig=sigPad(document.querySelector('#sig'))}
function clearSig(){let c=document.querySelector('#sig');c.getContext('2d').clearRect(0,0,c.width,c.height)}
async function sign(){try{await bapi('/api/branch-session/sign',{method:'POST',body:JSON.stringify({document:+doc.value,outbound:+out.value,inbound:+inn.value,note:note.value,signer:signer.value,signature:getSig()})});await load()}catch(e){alert(e.message)}}
async function correct(){try{let c=data.correction,fields=JSON.parse(c.fields_json),p={reason:reason.value,signer:signer.value,signature:getSig()};for(let f of fields)p[f]=f==='note'?document.querySelector('#'+f).value:+document.querySelector('#'+f).value;await bapi('/api/branch-session/correct',{method:'POST',body:JSON.stringify(p)});await load()}catch(e){alert(e.message)}}
</script></body></html>
