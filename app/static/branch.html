<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" type="image/png" href="/static/moving-match-favicon.png"><title>分館簽收</title><link rel="stylesheet" href="/static/style.css"><style>
/* 分館手機數量輸入：每一項固定為獨立一行，避免欄位錯位 */
#work .qty-grid{display:grid!important;grid-template-columns:minmax(0,1fr)!important;gap:12px!important;width:100%;max-width:100%}
#work .qty-grid label{display:grid!important;grid-template-columns:minmax(0,1fr) minmax(0,170px);align-items:center;gap:12px;width:100%;min-width:0;box-sizing:border-box;font-weight:600}
#work .qty-grid input{display:block;width:100%!important;min-width:0;max-width:100%;box-sizing:border-box;margin:0;text-align:right;font-size:20px}
@media(max-width:380px){#work .qty-grid label{grid-template-columns:minmax(0,1fr) minmax(0,135px);gap:8px}}

/* V19.3 branch delivery history: mobile cards, desktop table */
#branchHistory{margin-top:14px}
#branchHistory .history-tools{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:12px 0}
#branchHistory .history-tools select{max-width:220px}
#branchHistory .history-card{border:1px solid #dce3eb;border-radius:12px;padding:14px;margin:10px 0;background:#fff}
#branchHistory .history-four{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin:10px 0}
#branchHistory .history-four>div{background:#f3f6fa;padding:10px;border-radius:8px;min-width:0}
#branchHistory .history-four strong{display:block;font-size:20px}
#branchHistory .history-desktop{display:none}
#branchHistory .history-desktop table{width:100%;border-collapse:collapse}
#branchHistory .history-desktop th,#branchHistory .history-desktop td{padding:8px;border-bottom:1px solid #e1e6ee;text-align:left}
@media(min-width:800px){#branchHistory .history-mobile{display:none}#branchHistory .history-desktop{display:block;overflow-x:auto}}
.signer-row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:10px 0}.signer-row input{flex:1;min-width:120px;max-width:100%}#branchSigners{margin-top:18px}
</style></head><body>
<div id="desktopLogin" class="desktop-login-card">
  <h2>分館桌機登入</h2>
  <p class="muted">手機可繼續掃固定 QR；桌機可輸入分館代碼與 4 位 PIN，登入後進入同一套簽收流程。</p>
  <div class="desktop-login-grid">
    <label>分館代碼<input id="desktopBranchCode" placeholder="例如 A13"></label>
    <label>4 位 PIN<input id="desktopBranchPin" type="password" inputmode="numeric" maxlength="4"></label>
    <button class="btn" onclick="desktopLogin()">登入</button>
  </div>
</div><main class="mobile"><div class="card"><h1>分館簽收驗證</h1><div id="verify"><p class="muted">請輸入 4 位分館驗證碼</p><input id="pin" inputmode="numeric" maxlength="4" placeholder="○ ○ ○ ○" style="width:100%;font-size:26px;text-align:center"><button class="btn big" style="margin-top:10px" onclick="verifyBranch()">確認</button></div><div id="work" class="hidden"></div><section id="branchSigners" class="hidden" aria-label="常用簽收人員"><h2>常用簽收人員</h2><p class="muted">僅管理本站名單，姓名修改或停用不會更改歷史簽收紀錄。手寫簽名仍須由實際簽收人完成。</p><form onsubmit="addBranchSigner(event)"><label for="newBranchSigner">新增姓名</label><input id="newBranchSigner" maxlength="80" required autocomplete="off"><button class="btn" type="submit">新增</button></form><p><label><input id="showInactiveSigners" type="checkbox" onchange="loadBranchSigners()"> 同時查看已停用人員</label> <button class="btn alt" type="button" onclick="loadBranchSigners()">重新載入名單</button></p><div id="branchSignerMessage" role="status" aria-live="polite"></div><div id="branchSignerList"></div></section><section id="branchHistory" class="hidden" aria-label="本站配送歷史紀錄"><h2>本站配送紀錄</h2><div class="history-tools"><label>月份 <select id="branchHistoryMonth" onchange="loadBranchHistory()"></select></label><label><input type="checkbox" id="branchHistoryPending" onchange="loadBranchHistory()"> 只看待補簽</label></div><div id="branchHistoryBody" aria-live="polite"></div></section><div id="msg"></div></div></main><script src="/static/common.js"></script><script src="/static/branch-signers.js"></script><script>
function fmtDateTime(v){
  if(v===null||v===undefined||v==='') return '—';
  const s=String(v).trim();
  if(/^\d{4}-\d{2}-\d{2}$/.test(s)) return s;
  const m=s.match(/^(\d{4})-(\d{2})-(\d{2})[T\s](\d{2}):(\d{2})/);
  if(m) return `${m[1]}-${m[2]}-${m[3]} ${m[4]}:${m[5]}`;
  const d=new Date(s);
  if(!Number.isNaN(d.getTime())){
    const p=n=>String(n).padStart(2,'0');
    return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`;
  }
  return s;
}

const branchToken='__BRANCH_TOKEN__';let session=null,data=null,getSig=null;
async function bapi(url,opt={}){opt.headers={...(opt.headers||{}),'Authorization':'Bearer '+session,'Content-Type':'application/json'};let r=await fetch(url,opt);let text=await r.text(),j=null;try{j=text?JSON.parse(text):{}}catch(_){j={detail:text||('HTTP '+r.status)}}if(!r.ok)throw new Error(j.detail||('HTTP '+r.status));return j}

async function desktopLogin(){
  try{
    const branch_code=(document.querySelector('#desktopBranchCode').value||'').trim();
    const pin=(document.querySelector('#desktopBranchPin').value||'').trim();
    if(!branch_code||!pin)throw new Error('請輸入分館代碼與 PIN');
    const x=await fetch('/api/branch-session/desktop-login',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({branch_code,pin})
    }).then(async r=>{const t=await r.text();let j;try{j=t?JSON.parse(t):{}}catch(_){j={detail:t||('HTTP '+r.status)}}if(!r.ok)throw new Error(j.detail||'登入失敗');return j});
    session=x.session;
    sessionStorage.setItem('branch_session',session);
    document.querySelector('#desktopLogin').classList.add('hidden');
    document.querySelector('#verify').classList.add('hidden');
    work.classList.remove('hidden');
    await load();
  }catch(e){alert(e.message)}
}
async function verifyBranch(){try{let x=await api('/api/branch-session/verify',{method:'POST',body:JSON.stringify({token:branchToken,pin:document.querySelector('#pin').value})});session=x.session;document.querySelector('#verify').classList.add('hidden');work.classList.remove('hidden');await load()}catch(e){msg.innerHTML='<div class="error">'+e.message+'</div>'}}
async function load(){data=await bapi('/api/branch-session/today');await setupBranchHistory();await renderTaskChooser();await loadBranchSigners();if(data.status==='WAITING_BRANCH'||data.status==='LATE_BRANCH_PENDING')renderSign();else if(data.status==='WAITING_BRANCH_CORRECTION')renderCorrection();else if(data.status==='NO_DELIVERY')work.textContent='目前沒有待簽收配送，仍可管理本站常用簽收人員及查詢歷史。';else work.innerHTML=`<h2>${data.branch_name}</h2><p><b>配送日期：${data.service_date}</b></p><div class="ok"><b>簽收已送出完成</b><br>目前狀態：${statusText(data.status)}</div><p>簽收人：${data.correction_signer_name||data.signer_name||'—'}</p><p>實際簽收時間：${fmtDateTime(data.receipt_at||data.corrected_at||data.branch_signed_at)}</p><p class="muted">系統已保存本次簽名，請勿重複送出。</p>`}
function branchHistoryEscape(v){return String(v??'').replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]))}
function branchHistoryStatus(x){
  if(x.late_pending)return '待分館補簽';
  if(x.branch_signed_at)return '已簽收';
  return ({WAITING_SECRETARY:'待總館填寫',WAITING_DRIVER:'待司機配送',WAITING_BRANCH:'待分館簽收',WAITING_BRANCH_CORRECTION:'待更正',STOP_COMPLETED:'本站完成',ADMIN_CLOSED:'管理者結案'}[x.status]||x.status);
}
let branchHistoryInitialized=false;
async function setupBranchHistory(){
  const host=document.getElementById('branchHistory');
  host.classList.remove('hidden');
  if(branchHistoryInitialized){await loadBranchHistory();return}
  const d=new Date(),y=d.getFullYear(),m=d.getMonth()+1;
  const months=Array.from({length:12},(_,i)=>{const t=new Date(y,m-1-i,1);return t.getFullYear()+'-'+String(t.getMonth()+1).padStart(2,'0')});
  document.getElementById('branchHistoryMonth').innerHTML=months.map((v,i)=>'<option value="'+v+'">'+(i===0?'本月':'歷史月份')+'（'+v+'）</option>').join('');
  branchHistoryInitialized=true;
  await loadBranchHistory();
}
async function loadBranchHistory(){
  const host=document.getElementById('branchHistoryBody');
  const month=document.getElementById('branchHistoryMonth').value;
  const pending=document.getElementById('branchHistoryPending').checked;
  host.textContent='載入中…';
  try{
    const x=await bapi('/api/branch-session/history?month='+encodeURIComponent(month)+'&pending_only='+pending);
    if(!x.records.length){host.innerHTML='<p class="muted">所選月份沒有符合條件的配送紀錄。</p>';return}
    const count=v=>v===null||v===undefined?'待補':String(v);
    const fields=[['document_final','公文－總館送出'],['document_return_final','公文－分館送出'],['outbound_final','圖書－倉庫送出'],['inbound_final','圖書－分館送出']];
    const qty=r=>fields.map(([k,label])=>'<div><small>'+label+'</small><strong>'+count(r[k])+'</strong></div>').join('');
    const info=r=>'<div class="muted">路線：'+branchHistoryEscape(r.route_code)+' 線｜司機：'+branchHistoryEscape(r.driver_name||'—')+'</div><div class="muted">簽收人：'+branchHistoryEscape(r.correction_signer_name||r.signer_name||'—')+'｜簽收時間：'+branchHistoryEscape(fmtDateTime(r.receipt_at||r.corrected_at||r.branch_signed_at))+'</div>';
    const cards=x.records.map(r=>'<article class="history-card"><h3>'+branchHistoryEscape(r.service_date)+'｜'+branchHistoryEscape(branchHistoryStatus(r))+'</h3>'+info(r)+'<div class="history-four">'+qty(r)+'</div>'+(r.late_pending?'<button class="btn alt" onclick="selectBranchTask('+Number(r.id)+')">前往補簽</button>':'')+'</article>').join('');
    const table='<table><thead><tr><th>日期</th><th>路線</th><th>狀態</th>'+fields.map(([k,label])=>'<th>'+label+'</th>').join('')+'<th>簽收人</th><th>簽收時間</th><th>操作</th></tr></thead><tbody>'+x.records.map(r=>'<tr><td>'+branchHistoryEscape(r.service_date)+'</td><td>'+branchHistoryEscape(r.route_code)+'</td><td>'+branchHistoryEscape(branchHistoryStatus(r))+'</td>'+fields.map(([k])=>'<td>'+count(r[k])+'</td>').join('')+'<td>'+branchHistoryEscape(r.correction_signer_name||r.signer_name||'—')+'</td><td>'+branchHistoryEscape(fmtDateTime(r.receipt_at||r.corrected_at||r.branch_signed_at))+'</td><td>'+(r.late_pending?'<button class="btn alt" onclick="selectBranchTask('+Number(r.id)+')">補簽</button>':'—')+'</td></tr>').join('')+'</tbody></table>';
    host.innerHTML='<p class="muted">共 '+x.total+' 筆配送紀錄</p><div class="history-mobile">'+cards+'</div><div class="history-desktop">'+table+'</div>';
  }catch(e){host.textContent='查詢失敗：'+e.message}
}
async function renderTaskChooser(){
  const tasks=await bapi('/api/branch-session/tasks');
  let host=document.querySelector('#branchTaskChooser');
  if(!host){host=document.createElement('div');host.id='branchTaskChooser';work.parentNode.insertBefore(host,work)}
  const selected=tasks.selected?.id;
  const todayTask=tasks.today;
  const history=tasks.historical||[];
  host.innerHTML=`<div class="card" style="margin-bottom:14px"><h3>選擇配送日期</h3>
    <p class="muted">今日配送優先，歷史待補簽可自行選擇，不必先補完舊日期。</p>
    ${todayTask?`<button class="btn ${selected===todayTask.id?'':'alt'}" onclick="selectBranchTask(${todayTask.id})">今日配送｜${todayTask.service_date}${selected===todayTask.id?' ✓':''}</button>`:'<p class="muted">今日尚無配送紀錄。</p>'}
    <details style="margin-top:12px" ${!todayTask?'open':''}><summary>歷史待補簽（${history.length} 筆）</summary>
    ${history.length?history.map(x=>`<button class="btn ${selected===x.id?'':'alt'}" style="margin:6px" onclick="selectBranchTask(${x.id})">補簽 ${x.service_date}${selected===x.id?' ✓':''}</button>`).join(''):'<p class="muted">沒有歷史待補簽紀錄。</p>'}</details>
    </div>`;
}
async function selectBranchTask(id){
  try{await bapi('/api/branch-session/select-task',{method:'POST',body:JSON.stringify({delivery_id:id})});await load()}
  catch(e){alert(e.message)}
}
function canvasBlock(){return `<canvas id="sig" class="sig" width="600" height="220"></canvas><button class="btn alt" onclick="clearSig()">清除簽名</button>`}
function carriedItemsText(){const names={DOCUMENT_BAG:'公文袋',ATTACHMENT_BAG:'附件袋',PRIZE:'獎品',CONSUMABLE:'耗材',POSTER:'海報',NEWBORN_GIFT:'新生兒閱讀好禮',BOOKCLUB_RESOURCE:'讀書會資源庫用書',PROMOTION:'文宣',STATIONERY:'文具'};const a=data.items||[];return a.length?a.map(x=>`${x.item_type==='OTHER'?(x.item_name||'其他'):(names[x.item_type]||x.item_type)} ${x.quantity}`).join('、'):'無'}
function receiptInputValue(v){if(v){return String(v).replace(' ','T').slice(0,16)}const d=new Date(),p=n=>String(n).padStart(2,'0');return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}T${p(d.getHours())}:${p(d.getMinutes())}`}
function renderSign(){const late=data.status==='LATE_BRANCH_PENDING';work.innerHTML=`<h2>${data.branch_name}</h2><div class="${late?'notice':'muted'}">配送日期：<b>${data.service_date}</b>${late?'<br>此筆為未完成簽名的補填資料。可補填/修正數量並完成第一次簽名；送出後即鎖定，司機不需再次確認。<br>請核對司機已填寫的圖書－分館送出箱數，若不符可直接修改後簽名。':''}</div><div class="ok"><b>公文－總館送出：</b>${data.document_final??'尚未填寫'}<br><b>圖書－倉庫送出：</b>${data.outbound_final??0}<br><b>總館其他隨車物品：</b>${carriedItemsText()}</div><div class="qty-grid" aria-label="分館四項簽收數量">
        <label>公文－總館送出<input id="doc" type="number" min="0" value="${data.document_final??0}"></label>
        <label>公文－分館送出<input id="docReturn" type="number" min="0" value="${data.document_return_final??0}"></label>
        <label>圖書－倉庫送出<input id="out" type="number" min="0" value="${data.outbound_final??0}"></label>
        <label>圖書－分館送出${late&&data.inbound_final!==null?'（司機已填數量，請核對）':''}<input id="inn" type="number" min="0" value="${data.inbound_final??0}"></label>
        </div><p>備註</p><textarea id="note" style="width:100%">${data.note_final||''}</textarea><p>實際簽收時間</p><input id="receiptAt" type="datetime-local" value="${receiptInputValue(data.receipt_at)}" style="width:100%"><div class="muted">預設目前時間，可依實際簽收時間修改；系統真正送出簽名時間會另外保留。</div><p>簽收人姓名</p><input id="signer" style="width:100%"> <p>請簽名</p>${canvasBlock()}<button id="branchSignBtn" class="btn big" style="margin-top:12px" onclick="sign()">${late?'確認補填並完成簽名':'確認簽收'}</button>`;getSig=sigPad(document.querySelector('#sig'))}
function renderCorrection(){let c=data.correction;work.innerHTML=`<h2>${data.branch_name}</h2><p><b>配送日期：${data.service_date}</b></p><div class="notice"><b>司機要求更正</b><br>${c?.driver_note||'請重新確認數量；只需填寫需要修改的欄位'}</div><div class="ok" style="margin-top:10px">數量欄位為選填。留白代表沿用目前數量，不會被改成 0。</div><div class="ok"><b>公文－總館送出：</b>${data.document_final??'尚未填寫'}<br><b>圖書－倉庫送出：</b>${data.outbound_final??0}<br><b>總館其他隨車物品：</b>${carriedItemsText()}</div><p>公文－分館送出（目前：${data.document_return_final??0}）</p><input id="document_return" type="number" min="0" placeholder="若不修改請留白" style="width:100%"><p>圖書－分館送出（目前：${data.inbound_final??0}）</p><input id="inbound" type="number" min="0" placeholder="若不修改請留白" style="width:100%"><p>更正原因＊</p><textarea id="reason" style="width:100%"></textarea><p>更正人姓名＊</p><input id="signer" style="width:100%"><p>請重新簽名</p>${canvasBlock()}<button class="btn big" style="margin-top:12px" onclick="correct()">送出更正並重新簽名</button>`;getSig=sigPad(document.querySelector('#sig'))}
function clearSig(){let c=document.querySelector('#sig');c.getContext('2d').clearRect(0,0,c.width,c.height)}
async function sign(){
  if(!confirm('配送日期：'+data.service_date+'\\n'+(data.status==='LATE_BRANCH_PENDING'?'確認補填數量並完成簽名？送出後即不可再修改。':'確認完成本次簽收？')))return;
  const btn=document.querySelector('#branchSignBtn');
  if(btn?.disabled)return;
  const signature=getSig();
  if(!signer.value.trim()){alert('請輸入簽收人姓名');return}
  if(!signature){alert('請完成簽名');return}
  const payload={document:+doc.value,document_return:+docReturn.value,outbound:+out.value,inbound:+inn.value,note:note.value,signer:signer.value.trim(),signature,receipt_at:receiptAt.value};
  if(btn){btn.disabled=true;btn.textContent='送出中…'}
  try{
    const r=await bapi('/api/branch-session/sign',{method:'POST',body:JSON.stringify(payload)});
    await load();
  }catch(e){
    // 若第一筆已成功、但畫面刷新或網路回應異常造成再次送出，重新讀取狀態。
    if(String(e.message||'').includes('已填寫或已簽名')){
      try{await load();return}catch(_){}
    }
    alert(e.message);
    if(btn){btn.disabled=false;btn.textContent=data.status==='LATE_BRANCH_PENDING'?'確認補填並完成簽名':'確認簽收'}
  }
}
async function correct(){try{if(!confirm('配送日期：'+data.service_date+'\\n確定送出更正並重新簽名？'))return;const val=id=>{const v=document.getElementById(id).value.trim();return v===''?null:Number(v)};await bapi('/api/branch-session/correct',{method:'POST',body:JSON.stringify({document_return:val('document_return'),inbound:val('inbound'),reason:reason.value,signer:signer.value,signature:getSig()})});await load()}catch(e){alert(e.message)}}
</script></body></html>
