<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>重設密碼</title><link rel="stylesheet" href="/static/style.css"></head><body><main class="login card"><h1>重設密碼</h1><input id="pw" type="password" placeholder="新密碼" style="width:100%"><button class="btn big" style="margin-top:10px" onclick="go()">設定新密碼</button><div id="msg"></div></main><script src="/static/common.js"></script><script>const token=new URLSearchParams(location.search).get('token');async function go(){try{await api('/api/auth/password/reset',{method:'POST',body:JSON.stringify({token,new_password:pw.value})});msg.innerHTML='<div class="ok">密碼已更新。<a href="/">回登入頁</a></div>'}catch(e){msg.innerHTML='<div class="error">'+e.message+'</div>'}}</script></body></html>
