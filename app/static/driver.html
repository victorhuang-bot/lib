<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>司機工作頁</title><link rel="stylesheet" href="/static/style.css"></head><body><main class="mobile"><div class="card"><h1>今日配送</h1><div id="unlock"><p>請輸入司機 4 位 PIN</p><input id="pin" maxlength="4" inputmode="numeric" style="width:100%;font-size:28px;text-align:center"><button class="btn big" style="margin-top:10px" onclick="unlockDriver()">進入今日路線</button></div><div id="list" class="hidden"></div><div id="routeSigns" class="hidden"></div><div id="msg"></div></div></main><script src="/static/common.js"></script><script>
let token=null;
async function dapi(url,opt={}){opt.headers={...(opt.headers||{}),'Authorization':'Bearer '+token,'Content-Type':'application/json'};let r=await fetch(url,opt);let j=await r.json();if(!r.ok)throw new Error(j.detail||'錯誤');return j}
async function unlockDriver(){try{let key=localStorage.getItem('driver_device_key');if(!key)throw new Error('此手機尚未啟用');let x=await api('/api/driver/unlock',{method:'POST',body:JSON.stringify({device_key:key,pin:pin.value})});token=x.token;unlock.classList.add('hidden');list.classList.remove('hidden');load()}catch(e){msg.innerHTML='<div class="error">'+e.message+'</div>'}}
async function load(){let x=await dapi('/api/driver/today');list.innerHTML=x.map(d=>`<div class="card"><h2>${d.route_code}線｜${d.branch_name}</h2><div class="status">${statusText(d.status)}</div>${outboundEditor(d)}${d.status==='WAITING_DRIVER_CONFIRM'||d.status==='WAITING_DRIVER_RECONFIRM'?review(d):''}${d.status==='WAITING_BRANCH'?`<div class="notice" style="margin-top:10px">送出數量已儲存，等待分館簽收。簽收前仍可自行更正送出數量。</div>`:''}${d.status==='WAITING_BRANCH_CORRECTION'?`<div class="notice" style="margin-top:10px">已請分館更正，等待分館重新簽名。</div>`:''}${d.status==='STOP_COMPLETED'?`<div class="ok">本站完成 ${d.driver_confirmed_at||''}</div>`:''}</div>`).join('');await loadRouteSigns()}
function outboundEditor(d){if(!['WAITING_DRIVER','WAITING_SECRETARY','WAITING_BRANCH'].includes(d.status))return '';let saved=d.outbound_final;return `<p>公文：${d.document_final??0}</p><p><b>圖書送出：${saved==null?'尚未輸入':saved+' 箱'}</b></p><input id="o${d.id}" type="number" min="0" value="${saved??''}" placeholder="圖書送出箱數" style="width:100%"><button class="btn big" onclick="setOut(${d.id})">${saved==null?'儲存送出數量':'更新送出數量'}</button>`}
function review(d){return `<hr><p>公文 ${d.document_final}｜送出 ${d.outbound_final}｜收回 ${d.inbound_final}</p><p>備註：${d.note_final||'無'}</p><p>簽收人：${d.correction_signer_name||d.signer_name}</p>${d.correction_reason?`<div class="notice">最近更正原因：${d.correction_reason}</div>`:''}<button class="btn big" onclick="confirmStop(${d.id})">確認無誤・完成本站</button><button class="btn warn big" style="margin-top:8px" onclick="corr(${d.id})">資料有誤・請分館更正</button>`}
async function setOut(id){try{let el=document.querySelector('#o'+id);if(el.value==='')throw new Error('請輸入送出數量');await dapi('/api/driver/deliveries/'+id+'/outbound',{method:'PATCH',body:JSON.stringify({qty:+el.value})});load()}catch(e){alert(e.message)}}
async function confirmStop(id){try{await dapi('/api/driver/deliveries/'+id+'/confirm',{method:'POST'});load()}catch(e){alert(e.message)}}
async function corr(id){let note=prompt('請輸入需要分館重新確認的原因','請重新確認公文、圖書送出、圖書收回數量');if(note===null)return;try{await dapi('/api/driver/deliveries/'+id+'/request-correction',{method:'POST',body:JSON.stringify({note})});load()}catch(e){alert(e.message)}}

async function loadRouteSigns(){let rs=await dapi('/api/driver/routes/today');routeSigns.classList.toggle('hidden',!rs.length);routeSigns.innerHTML=rs.map(r=>{if(r.status==='DRIVER_SIGNED')return `<div class="card"><h2>${r.code}線｜今日路線總表</h2><div class="ok">已完成路線簽名 ${r.driver_signed_at||''}</div></div>`;if(r.total===0||r.completed<r.total)return `<div class="card"><h2>${r.code}線｜今日路線總表</h2><div class="notice">目前完成 ${r.completed}/${r.total} 站。全部站點完成後才能簽名。</div></div>`;return `<div class="card"><h2>${r.code}線｜全部 ${r.total} 站完成</h2><p>請確認今日路線總表後簽名。簽名後此路線交由總館秘書做第三方最終確認。</p><canvas id="rs${r.id}" width="650" height="190" style="width:100%;border:2px dashed #b8c0cc;border-radius:12px;touch-action:none"></canvas><button class="btn alt big" onclick="clearRouteSig(${r.id})">清除簽名</button><button class="btn big" style="margin-top:8px" onclick="signRoute(${r.id})">確認並簽署 ${r.code} 線總表</button></div>`}).join('');rs.filter(r=>r.completed===r.total&&r.total>0&&r.status!=='DRIVER_SIGNED').forEach(r=>setupRouteCanvas(r.id))}
function setupRouteCanvas(id){const c=document.getElementById('rs'+id);if(!c||c.dataset.ready)return;c.dataset.ready='1';const ctx=c.getContext('2d');ctx.lineWidth=3;ctx.lineCap='round';let on=false;const pos=e=>{const r=c.getBoundingClientRect(),t=e.touches?e.touches[0]:e;return [(t.clientX-r.left)*c.width/r.width,(t.clientY-r.top)*c.height/r.height]};const st=e=>{on=true;c.dataset.dirty='1';let [x,y]=pos(e);ctx.beginPath();ctx.moveTo(x,y);e.preventDefault()};const mv=e=>{if(!on)return;let [x,y]=pos(e);ctx.lineTo(x,y);ctx.stroke();e.preventDefault()};const en=e=>{on=false};c.addEventListener('mousedown',st);c.addEventListener('mousemove',mv);window.addEventListener('mouseup',en);c.addEventListener('touchstart',st,{passive:false});c.addEventListener('touchmove',mv,{passive:false});c.addEventListener('touchend',en,{passive:false})}
function clearRouteSig(id){const c=document.getElementById('rs'+id);c.getContext('2d').clearRect(0,0,c.width,c.height);c.dataset.dirty=''}
async function signRoute(id){const c=document.getElementById('rs'+id);if(!c||c.dataset.dirty!=='1'){alert('請先完成路線簽名');return}if(!confirm('確認所有站點資料無誤並簽署今日路線總表？'))return;try{await dapi('/api/driver/routes/'+id+'/sign',{method:'POST',body:JSON.stringify({signature:c.toDataURL('image/png')})});alert('路線簽名完成');load()}catch(e){alert(e.message)}}
</script></body></html>
