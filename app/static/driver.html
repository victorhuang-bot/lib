<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>司機工作頁</title><link rel="stylesheet" href="/static/style.css"></head><body><main class="mobile"><div class="card"><h1>今日配送</h1><div id="unlock"><p>請輸入司機 4 位 PIN</p><input id="pin" maxlength="4" inputmode="numeric" style="width:100%;font-size:28px;text-align:center"><button class="btn big" style="margin-top:10px" onclick="unlockDriver()">進入今日路線</button></div>
<div id="routeSwitcher" class="hidden" style="margin:12px 0"></div>
<div id="list" class="hidden"></div><div id="routeSigns" class="hidden"></div><div id="msg"></div></div></main><script src="/static/common.js"></script><script>
function fmtDateTime(v){
  if(v===null||v===undefined||v==='') return '—';
  const s=String(v).trim();
  if(/^\d{4}-\d{2}-\d{2}$/.test(s)) return s;
  const m=s.match(/^(\d{4})-(\d{2})-(\d{2})[T\s](\d{2}):(\d{2})/);
  if(m) return `${m[1]}-${m[2]}-${m[3]} ${m[4]}:${m[5]}`;
  const d=new Date(s);
  if(!Number.isNaN(d.getTime())){
    const p=n=>String(n).padStart(2,'0');
    return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`;
  }
  return s;
}

let token=null,itemMap={},todayDeliveries=[],todayRoutes=[],handoffNotices=[],selectedRoute=null;

async function dapi(url,opt={}){
  opt.headers={...(opt.headers||{}),'Authorization':'Bearer '+token,'Content-Type':'application/json'};
  let r=await fetch(url,opt), text=await r.text(), j={};
  try{j=text?JSON.parse(text):{}}catch(_){throw new Error(text||'伺服器回應格式錯誤')}
  if(!r.ok)throw new Error(j.detail||'錯誤');
  return j;
}

async function unlockDriver(){
  try{
    let key=localStorage.getItem('driver_device_key');
    if(!key)throw new Error('此手機尚未啟用');
    let x=await api('/api/driver/unlock',{method:'POST',body:JSON.stringify({device_key:key,pin:pin.value})});
    token=x.token;
    unlock.classList.add('hidden');
    routeSwitcher.classList.remove('hidden');
    list.classList.remove('hidden');
    await load();
  }catch(e){msg.innerHTML='<div class="error">'+e.message+'</div>'}
}

async function load(){
  let [x,hn,its,rs]=await Promise.all([
    dapi('/api/driver/today'),
    dapi('/api/driver/handoff-notices'),
    dapi('/api/driver/items/today'),
    dapi('/api/driver/routes/today')
  ]);
  todayDeliveries=x||[];
  handoffNotices=hn||[];
  todayRoutes=rs||[];
  itemMap={};
  for(const it of its||[]){(itemMap[it.delivery_id]??=[]).push(it)}

  const available=[...new Set([
    ...todayRoutes.map(r=>String(r.code)),
    ...todayDeliveries.map(d=>String(d.route_code))
  ])].sort((a,b)=>Number(a)-Number(b));

  if(!available.length){
    selectedRoute=null;
    routeSwitcher.innerHTML='<div class="notice">今日沒有指派路線。</div>';
    list.innerHTML='';
    routeSigns.innerHTML='';
    routeSigns.classList.add('hidden');
    return;
  }
  if(!selectedRoute || !available.includes(String(selectedRoute))) selectedRoute=available[0];
  renderRouteSwitcher(available);
  renderSelectedRoute();
  await loadRouteSigns();
}

function renderRouteSwitcher(routes){
  const cards=routes.map(code=>{
    const r=todayRoutes.find(x=>String(x.code)===String(code));
    const ds=todayDeliveries.filter(x=>String(x.route_code)===String(code));
    const completed=r?.completed??ds.filter(x=>['STOP_COMPLETED','LATE_BRANCH_PENDING','ADMIN_CLOSED'].includes(x.status)).length;
    const total=r?.total??ds.length;
    const signed=r?.status==='DRIVER_SIGNED';
    const active=String(selectedRoute)===String(code);
    return `<button onclick="selectRoute('${code}')" style="border:${active?'3px solid #172230':'1px solid #cfd7e3'};background:${active?'#eef3f8':'#fff'};border-radius:14px;padding:12px 16px;text-align:left;min-width:132px">
      <b style="font-size:20px">${code}線</b><br>
      <span style="font-size:14px">${completed}/${total} 站${signed?'｜已簽名':''}</span>
    </button>`;
  }).join('');
  routeSwitcher.innerHTML=`<div class="card" style="padding:14px">
    <div style="font-weight:700;margin-bottom:8px">今日負責路線｜同一支手機可直接切換</div>
    <div class="muted" style="margin-bottom:10px">目前作業：<b>${selectedRoute}線</b>。每條路線進度與簽名獨立。</div>
    <div style="display:flex;gap:8px;flex-wrap:wrap">${cards}</div>
  </div>`;
}

async function selectRoute(code){
  selectedRoute=String(code);
  const routes=[...new Set([
    ...todayRoutes.map(r=>String(r.code)),
    ...todayDeliveries.map(d=>String(d.route_code))
  ])].sort((a,b)=>Number(a)-Number(b));
  renderRouteSwitcher(routes);
  renderSelectedRoute();
  await loadRouteSigns();
  window.scrollTo({top:0,behavior:'smooth'});
}

function renderSelectedRoute(){
  const x=todayDeliveries.filter(d=>String(d.route_code)===String(selectedRoute));
  const hn=handoffNotices.filter(h=>String(h.route_code)===String(selectedRoute));
  const notice=hn.length?hn.map(h=>`<div class="notice"><b>今日有臨時接手任務</b><br>${h.route_code}線｜原司機：${h.from_driver}<br>接手起點：${h.start_branch}<br>原因：${h.reason}<br>尚餘 ${h.remaining} 站</div>`).join(''):'';

  list.innerHTML=`<div class="card" style="background:#f7f9fc"><h2 style="margin:0">目前：${selectedRoute}線</h2><div class="muted">以下只顯示 ${selectedRoute} 線分館，避免跨路線誤填。</div></div>`+
    notice+
    x.map(d=>`<div class="card"><h2>${d.route_code}線｜${d.branch_name}</h2><div class="status">${statusText(d.status)}</div>${outboundEditor(d)}${d.status==='WAITING_DRIVER_CONFIRM'||d.status==='WAITING_DRIVER_RECONFIRM'?review(d):''}${d.status==='WAITING_BRANCH'?`<div class="notice" style="margin-top:10px">送出數量已儲存，等待分館簽收。若分館今日無法簽名，可先完成今日運送並改為稍後補簽。</div><button class="btn alt big" style="margin-top:8px" onclick="deferBranchSign(${d.id})">本站運送完成・分館稍後補簽</button>`:''}${d.status==='LATE_BRANCH_PENDING'?`<div class="ok" style="margin-top:10px">本站今日運送已完成，分館可於之後補填數量與簽名；司機不需再次確認。</div>`:''}${d.status==='WAITING_BRANCH_CORRECTION'?`<div class="notice" style="margin-top:10px">已請分館更正，等待分館重新簽名。</div>`:''}${d.status==='STOP_COMPLETED'?`<div class="ok">本站完成 ${fmtDateTime(d.driver_confirmed_at)}</div>`:''}</div>`).join('');
}
const DRIVER_ITEM_LABELS={
  DOCUMENT_BAG:'公文袋',ATTACHMENT_BAG:'附件袋',PRIZE:'獎品',CONSUMABLE:'耗材',
  POSTER:'海報',NEWBORN_GIFT:'新生兒閱讀好禮',BOOKCLUB_RESOURCE:'讀書會資源庫用書',
  PROMOTION:'文宣',STATIONERY:'文具',OTHER:'其他'
};
function driverItemName(x){
  if(x.item_type==='OTHER')return x.item_name||'其他';
  return DRIVER_ITEM_LABELS[x.item_type]||x.item_name||'其他物品';
}
function itemText(id){
  const a=itemMap[id]||[];
  return a.length?a.map(x=>`${driverItemName(x)} × ${x.quantity}`).join('、'):'無';
}
function outboundEditor(d){if(!['WAITING_DRIVER','WAITING_SECRETARY','WAITING_BRANCH'].includes(d.status))return '';let saved=d.outbound_final;return `<p>總館公文送出：${d.document_final??'尚未填寫'}</p><p><b>其他隨車物品：</b>${itemText(d.id)}</p><p><b>圖書送出：${saved==null?'尚未輸入':saved+' 箱'}</b></p><input id="o${d.id}" type="number" min="0" value="${saved??''}" placeholder="圖書送出箱數" style="width:100%"><button class="btn big" onclick="setOut(${d.id})">${saved==null?'儲存送出數量':'更新送出數量'}</button>`}
function review(d){return `<hr><p>公文送出 ${d.document_final??'—'}｜公文收回 ${d.document_return_final??'—'}｜圖書送出 ${d.outbound_final??'—'}｜圖書收回 <b data-inbound="${d.id}" data-value="${d.inbound_final??''}">${d.inbound_final??'—'}</b></p><p>備註：${d.note_final||'無'}</p><p>簽收人：${d.correction_signer_name||d.signer_name}</p>${d.correction_reason?`<div class="notice">最近更正原因：${d.correction_reason}</div>`:''}<button class="btn big" onclick="confirmStop(${d.id})">確認無誤・完成本站</button><button class="btn warn big" style="margin-top:8px" onclick="corr(${d.id})">資料有誤・請分館更正</button>`}
async function setOut(id){try{let el=document.querySelector('#o'+id);if(el.value==='')throw new Error('請輸入送出數量');await dapi('/api/driver/deliveries/'+id+'/outbound',{method:'PATCH',body:JSON.stringify({qty:+el.value})});load()}catch(e){alert(e.message)}}
async function confirmStop(id){try{await dapi('/api/driver/deliveries/'+id+'/confirm',{method:'POST'});load()}catch(e){alert(e.message)}}
async function corr(id){let current=document.querySelector('[data-inbound="'+id+'"]')?.dataset.value||'';let note=prompt('請輸入需要分館重新確認的原因（目前圖書收回：'+(current||'—')+'）','請重新確認圖書收回數量');if(note===null)return;try{await dapi('/api/driver/deliveries/'+id+'/request-correction',{method:'POST',body:JSON.stringify({note})});load()}catch(e){alert(e.message)}}
async function deferBranchSign(id){if(!confirm('確認本站今日運送已完成，分館改為之後補填數量與簽名？\n司機完成路線簽名後，不需要再回來確認此站。'))return;try{await dapi('/api/driver/deliveries/'+id+'/defer-branch-sign',{method:'POST'});await load()}catch(e){alert(e.message)}}

async function loadRouteSigns(){
  const rs=(todayRoutes||[]).filter(r=>String(r.code)===String(selectedRoute));
  routeSigns.classList.toggle('hidden',!rs.length);
  let cards=[];
  for(const r of rs){
    if(r.status==='DRIVER_SIGNED'){
      let sm=await dapi('/api/driver/routes/'+r.id+'/summary');
      cards.push(routeSummaryCard(sm,true));
      continue;
    }
    if(r.total===0||r.completed<r.total){
      cards.push(`<div class="card"><h2>${r.code}線｜今日路線總表</h2><div class="notice">目前運送完成 ${r.completed}/${r.total} 站。尚有有效站點未完成運送，完成後即可簽名；待分館補簽不影響司機簽名。</div></div>`);
      continue;
    }
    let sm=await dapi('/api/driver/routes/'+r.id+'/summary');
    cards.push(routeSummaryCard(sm,false));
  }
  routeSigns.innerHTML=cards.join('');
  rs.filter(r=>r.completed===r.total&&r.total>0&&r.status!=='DRIVER_SIGNED').forEach(r=>setupRouteCanvas(r.id));
}
function routeSummaryCard(sm,signed){const r=sm.route,t=sm.totals;const late=sm.stops.filter(x=>x.status==='LATE_BRANCH_PENDING').length;const rows=sm.stops.map(x=>`<tr><td>${x.branch_name}${x.status==='LATE_BRANCH_PENDING'?'<br><span class="muted">待分館補簽</span>':''}<br><span class="muted">${itemText(x.id)}</span></td><td>${x.document_final??'待總館'}</td><td>${x.status==='LATE_BRANCH_PENDING'?'待補':(x.document_return_final??0)}</td><td>${x.outbound_final??0}</td><td>${x.status==='LATE_BRANCH_PENDING'?'待補':(x.inbound_final??0)}</td></tr>`).join('');return `<div class="card"><h2>${r.code}線｜今日路線總表</h2>${late?`<div class="notice">本線有 ${late} 站已完成運送、待分館之後補簽。下方總計為目前已填數量；補簽後報表與月累積會自動更新，司機不需再次確認。</div>`:''}<div style="overflow:auto"><table><thead><tr><th>分館</th><th>公文送出</th><th>公文收回</th><th>圖書送出</th><th>圖書收回</th></tr></thead><tbody>${rows}<tr><th>本線目前總計</th><th>${t.document}</th><th>${t.document_return}</th><th>${t.outbound}</th><th>${t.inbound}</th></tr></tbody></table></div>${signed?`<div class="ok">已完成路線簽名 ${r.driver_signed_at?fmtDateTime(r.driver_signed_at):''}</div>`:`<p class="notice">請核對目前已填資料；待補簽分館不影響今日路線簽名。</p><canvas id="rs${r.id}" width="650" height="190" style="width:100%;border:2px dashed #b8c0cc;border-radius:12px;touch-action:none"></canvas><button class="btn alt big" onclick="clearRouteSig(${r.id})">清除簽名</button><button class="btn big" style="margin-top:8px" onclick="signRoute(${r.id})">確認今日運送並簽署 ${r.code} 線總表</button>`}</div>`}
function setupRouteCanvas(id){const c=document.getElementById('rs'+id);if(!c||c.dataset.ready)return;c.dataset.ready='1';const ctx=c.getContext('2d');ctx.lineWidth=3;ctx.lineCap='round';let on=false;const pos=e=>{const r=c.getBoundingClientRect(),t=e.touches?e.touches[0]:e;return [(t.clientX-r.left)*c.width/r.width,(t.clientY-r.top)*c.height/r.height]};const st=e=>{on=true;c.dataset.dirty='1';let [x,y]=pos(e);ctx.beginPath();ctx.moveTo(x,y);e.preventDefault()};const mv=e=>{if(!on)return;let [x,y]=pos(e);ctx.lineTo(x,y);ctx.stroke();e.preventDefault()};const en=e=>{on=false};c.addEventListener('mousedown',st);c.addEventListener('mousemove',mv);window.addEventListener('mouseup',en);c.addEventListener('touchstart',st,{passive:false});c.addEventListener('touchmove',mv,{passive:false});c.addEventListener('touchend',en,{passive:false})}
function clearRouteSig(id){const c=document.getElementById('rs'+id);c.getContext('2d').clearRect(0,0,c.width,c.height);c.dataset.dirty=''}
async function signRoute(id){const c=document.getElementById('rs'+id);if(!c||c.dataset.dirty!=='1'){alert('請先完成路線簽名');return}if(!confirm('確認目前這一條路線的所有站點資料無誤並簽署路線總表？其他負責路線不受影響。'))return;try{await dapi('/api/driver/routes/'+id+'/sign',{method:'POST',body:JSON.stringify({signature:c.toDataURL('image/png')})});alert('本路線簽名完成；可直接切換其他負責路線繼續作業。');load()}catch(e){alert(e.message)}}
</script></body></html>
