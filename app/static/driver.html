<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>司機工作頁</title><link rel="stylesheet" href="/static/style.css"></head><body><main class="mobile"><div class="card"><h1>今日配送</h1><div id="unlock"><p>請輸入司機 4 位 PIN</p><input id="pin" maxlength="4" inputmode="numeric" style="width:100%;font-size:28px;text-align:center"><button class="btn big" style="margin-top:10px" onclick="unlockDriver()">進入今日路線</button></div><div id="list" class="hidden"></div><div id="msg"></div></div></main><script src="/static/common.js"></script><script>let token=null;async function dapi(url,opt={}){opt.headers={...(opt.headers||{}),'Authorization':'Bearer '+token,'Content-Type':'application/json'};let r=await fetch(url,opt);let j=await r.json();if(!r.ok)throw new Error(j.detail||'錯誤');return j}async function unlockDriver(){try{let key=localStorage.getItem('driver_device_key');if(!key)throw new Error('此手機尚未啟用');let x=await api('/api/driver/unlock',{method:'POST',body:JSON.stringify({device_key:key,pin:pin.value})});token=x.token;unlock.classList.add('hidden');list.classList.remove('hidden');load()}catch(e){msg.innerHTML='<div class="error">'+e.message+'</div>'}}async function load(){let x=await dapi('/api/driver/today');list.innerHTML=x.map(d=>`<div class="card"><h2>${d.route_code}線｜${d.branch_name}</h2><div class="status">${statusText(d.status)}</div>${d.status==='WAITING_DRIVER'?`<p>公文：${d.document_final??0}</p><input id="o${d.id}" type="number" min="0" placeholder="圖書送出" style="width:100%"><button class="btn big" onclick="setOut(${d.id})">儲存送出數量</button>`:''}${d.status==='WAITING_DRIVER_CONFIRM'?review(d,true):''}${d.status==='WAITING_DRIVER_RECONFIRM'?review(d,false):''}${d.status==='STOP_COMPLETED'?`<div class="ok">本站完成 ${d.driver_confirmed_at||''}</div>`:''}</div>`).join('')}function review(d,allowCorrection){return `<hr><p>公文 ${d.document_final}｜送出 ${d.outbound_final}｜收回 ${d.inbound_final}</p><p>備註：${d.note_final||'無'}</p><p>簽收人：${d.correction_signer_name||d.signer_name}</p>${d.correction_reason?`<div class="notice">更正原因：${d.correction_reason}</div>`:''}<button class="btn big" onclick="confirmStop(${d.id})">確認無誤・完成本站</button>${allowCorrection?`<button class="btn warn big" style="margin-top:8px" onclick="corr(${d.id})">資料有誤・請分館更正</button>`:''}`}
async function setOut(id){try{await dapi('/api/driver/deliveries/'+id+'/outbound',{method:'PATCH',body:JSON.stringify({qty:+document.querySelector('#o'+id).value})});load()}catch(e){alert(e.message)}}async function confirmStop(id){try{await dapi('/api/driver/deliveries/'+id+'/confirm',{method:'POST'});load()}catch(e){alert(e.message)}}async function corr(id){let f=prompt('輸入要更正欄位，可複選逗號分隔：document,outbound,inbound,note','inbound');if(!f)return;let note=prompt('司機更正說明','請重新確認');try{await dapi('/api/driver/deliveries/'+id+'/request-correction',{method:'POST',body:JSON.stringify({fields:f.split(',').map(x=>x.trim()),note})});load()}catch(e){alert(e.message)}}</script></body></html>
