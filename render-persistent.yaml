# Alternate paid Render example with a persistent local disk.
# Current V19 production uses PostgreSQL via DATABASE_URL; this file is retained only as an optional deployment template.
services:
  - type: web
    name: library-logistics
    runtime: docker
    plan: starter
    healthCheckPath: /health
    autoDeploy: true
    disk:
      name: library-logistics-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: APP_BASE_URL
        value: https://lib.moving-match.com
      - key: APP_ENV
        value: production
      - key: DATA_DIR
        value: /var/data
      - key: DEMO_RESET_LINKS
        value: "false"
      - key: ADMIN_INITIAL_PASSWORD
        sync: false
      - key: SECRETARY_INITIAL_PASSWORD
        sync: false
      - key: DEMO_BRANCH_PIN
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_REFRESH_TOKEN
        sync: false
      - key: GOOGLE_GMAIL_USER
        value: victor.huang@moving-match.com
      - key: EMAIL_FROM_ADDRESS
        value: lib@moving-match.com
      - key: EMAIL_FROM_NAME
        value: 圖書物流配送暨電子簽收管理系統
