services:
  - type: web
    name: library-logistics-demo
    runtime: docker
    plan: free
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: APP_BASE_URL
        value: https://lib.moving-match.com
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: DEMO_RESET_LINKS
        value: "false"
      - key: ADMIN_INITIAL_PASSWORD
        sync: false
      - key: SECRETARY_INITIAL_PASSWORD
        sync: false
      - key: DEMO_BRANCH_PIN
        sync: false
      - key: SMTP_PASSWORD
        sync: false
